<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>외도민 타임 라인</title>

    <!-- Open Graph for Social Sharing (KakaoTalk, Message) -->
    <meta property="og:title" content="외도민 타임 라인">
    <meta property="og:description" content="외국인 도시민박업 실전 창업을 위한 A to Z 로드맵 & 꿀팁 가이드">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://0218.netlify.app/">
    <meta property="og:image"
        content="https://images.unsplash.com/photo-1556912173-3db996ea8c89?q=80&w=1200&auto=format&fit=crop">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #F1F5F9;
            color: #1E293B;
            -webkit-tap-highlight-color: transparent;
        }

        /* Container */
        .app-container {
            max-width: 100%;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .gradient-header {
            position: relative;
            z-index: auto;
            /* Ensure no parent stacking context traps children */
            padding-bottom: 60px;
            /* Increased for spacing */
        }

        .header-bg {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #1e1b4b 0%, #1e3a8a 50%, #2563eb 100%);
            border-radius: 0 0 40px 40px;
            box-shadow: 0 10px 40px -10px rgba(30, 58, 138, 0.4);
            overflow: hidden;
            /* Clips the glow */
            z-index: 0;
        }

        .header-bg::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -20%;
            width: 70%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 60%);
            transform: rotate(30deg);
            pointer-events: none;
        }

        /* Chart Area */
        .chart-wrapper {
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 50px -12px rgba(15, 23, 42, 0.12);
            margin: -35px 16px 24px 16px;
            padding: 24px 16px;
            height: auto;
            min-height: 850px;
            position: relative;
            z-index: 20;
            /* Sit above Header BG, below Search Dropdown */
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        .chart-scroll-area {
            overflow-x: auto;
            overflow-y: hidden;
            width: 100%;
            flex-grow: 1;
            -webkit-overflow-scrolling: touch;
        }

        /* Modal & Detail Panel */
        .modal-content {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            max-width: 1100px;
            margin: 0 auto;
        }

        .detail-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
            z-index: 60;
            display: flex;
            flex-direction: column;
        }

        .detail-panel.active {
            transform: translateX(0);
        }

        /* Formatting Helpers */
        .prose h5 {
            font-size: 1.25rem;
            font-weight: 800;
            color: #1e3a8a;
            margin-top: 2rem;
            margin-bottom: 1rem;
            border-left: 5px solid #3b82f6;
            padding-left: 0.75rem;
        }

        .prose p {
            margin-bottom: 1rem;
            line-height: 1.7;
            color: #475569;
        }

        .note-box {
            background: #eff6ff;
            border-left: 4px solid #3b82f6;
            padding: 20px;
            border-radius: 0 16px 16px 0;
            margin: 20px 0;
            font-size: 0.95rem;
            color: #1e40af;
        }

        .warn-box {
            background: #fef2f2;
            border-left: 4px solid #ef4444;
            padding: 20px;
            border-radius: 0 16px 16px 0;
            margin: 20px 0;
            font-size: 0.95rem;
            color: #991b1b;
        }

        .script-box {
            background: #f0fdf4;
            border: 1.5px dashed #4ade80;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            position: relative;
        }

        .script-box::before {
            content: "💬 필승 실전 멘트";
            display: block;
            font-size: 0.7rem;
            font-weight: 900;
            color: #166534;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .script-box blockquote {
            font-family: 'Pretendard', sans-serif;
            font-weight: 700;
            color: #14532d;
            font-style: normal;
            border: none;
            padding: 0;
            margin: 0;
            font-size: 1.05rem;
        }

        .guide-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 14px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .guide-card:hover {
            border-color: #3b82f6;
            background-color: #f8fafc;
            transform: translateY(-3px);
        }

        .toolbox-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .toolbox-btn:hover {
            background: white;
            color: #1e3a8a;
            transform: scale(1.05);
        }

        /* Search Dropdown Custom */
        .search-dropdown {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>

<body>

    <div class="app-container">
        <!-- HEADER -->
        <div class="gradient-header relative">
            <!-- Background Layer (Clipped) -->
            <div class="header-bg"></div>

            <!-- Content Layer (High Z-Index to stay above Chart) -->
            <div class="relative z-30 px-6 pt-10 pb-12">
                <div class="flex justify-between items-start mb-8">
                    <div>
                        <!-- Badges Removed -->
                        <h1 class="text-3xl font-black text-white leading-tight tracking-tight">외도민 타임 라인</h1>
                        <p class="text-sm text-blue-100 mt-2 font-medium opacity-90">Created by <span
                                class="font-bold text-amber-300">주money</span></p>
                    </div>
                    <button onclick="openToolbox()" class="toolbox-btn">
                        <i class="fas fa-comment-medical text-lg"></i>
                        <span>상황별 필승 멘트함</span>
                    </button>
                </div>

                <!-- Search Bar -->
                <div class="relative z-30">
                    <input type="text" id="searchInput" placeholder="임대인 설득, 조명 색온도, 구청 실사 등 키워드 검색"
                        class="w-full pl-12 pr-4 py-4 rounded-2xl bg-white/10 border border-white/30 text-white placeholder-white/60 focus:bg-white focus:text-slate-900 focus:outline-none focus:ring-4 focus:ring-blue-500/30 transition-all text-sm font-semibold">
                    <i class="fas fa-search absolute left-4 top-4.5 text-white/50 text-xl pt-1"></i>
                    <div id="searchResults" class="hidden absolute top-full left-0 w-full mt-3 search-dropdown z-50">
                    </div>
                </div>
            </div>
        </div>

        <!-- MAIN CHART -->
        <div class="chart-wrapper">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 px-2 gap-4">
                <h3 class="text-base font-extrabold text-slate-800 flex items-center gap-2">
                    <i class="fas fa-calendar-alt text-blue-600"></i> 타임 라인 (Day 0 ~ 45)
                </h3>
                <div class="flex flex-wrap gap-3 text-[11px] font-bold">
                    <div class="flex items-center gap-1.5 px-2 py-1 bg-slate-100 rounded-full text-slate-600">
                        <div class="w-2.5 h-2.5 rounded-full bg-slate-400"></div>준비
                    </div>
                    <div class="flex items-center gap-1.5 px-2 py-1 bg-red-50 rounded-full text-red-600">
                        <div class="w-2.5 h-2.5 rounded-full bg-red-500"></div>계약
                    </div>
                    <div class="flex items-center gap-1.5 px-2 py-1 bg-orange-50 rounded-full text-orange-600">
                        <div class="w-2.5 h-2.5 rounded-full bg-orange-500"></div>중요
                    </div>
                    <div class="flex items-center gap-1.5 px-2 py-1 bg-blue-50 rounded-full text-blue-600">
                        <div class="w-2.5 h-2.5 rounded-full bg-blue-500"></div>설비
                    </div>
                    <div class="flex items-center gap-1.5 px-2 py-1 bg-purple-50 rounded-full text-purple-600">
                        <div class="w-2.5 h-2.5 rounded-full bg-purple-500"></div>행정
                    </div>
                </div>
            </div>

            <div class="relative border border-slate-100 rounded-3xl overflow-hidden bg-white" style="height: 750px;">
                <div class="chart-scroll-area h-full flex overflow-x-auto overflow-y-hidden relative w-full">
                    <!-- Y-Axis Labels (Sticky) -->
                    <div class="sticky left-0 z-20 bg-white/95 backdrop-blur-sm border-r border-slate-100 flex-none w-[160px] flex flex-col shadow-[4px_0_12px_-4px_rgba(0,0,0,0.05)]"
                        id="yAxisLabels" style="height: 750px;">
                        <div
                            class="h-[40px] border-b border-slate-100 bg-slate-50/50 flex items-center justify-center shrink-0">
                            <span class="text-[10px] text-slate-400 font-black uppercase tracking-widest">Process
                                Step</span>
                        </div>
                    </div>
                    <!-- Chart Content Area -->
                    <div class="flex-grow flex flex-col relative min-w-[800px]">
                        <div
                            class="h-[40px] flex items-center border-b border-slate-100 bg-slate-50/50 relative shrink-0">
                            <div class="absolute left-0 text-[10px] text-slate-400 font-bold pl-4">START (DAY 0)</div>
                            <div class="absolute right-0 text-[10px] text-slate-400 font-bold pr-4">LAUNCH (DAY 45)
                            </div>
                        </div>
                        <div class="chart-content relative w-full" style="height: 710px;">
                            <div id="chartBackgroundRows" class="absolute inset-0 w-full flex flex-col z-0"></div>
                            <canvas id="mobileChart" class="relative z-10"></canvas>
                        </div>
                    </div>
                </div>
                <div id="externalTooltip"
                    class="absolute bg-slate-900/90 backdrop-blur-md text-white text-xs rounded-xl px-4 py-3 pointer-events-none opacity-0 z-50 transition-opacity shadow-xl border border-white/20">
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL (Main) -->
    <div id="detailModal" class="fixed inset-0 z-50 hidden">
        <div class="modal-overlay absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeModal()"></div>
        <div
            class="absolute inset-x-0 bottom-0 top-10 bg-white rounded-t-[40px] flex flex-col modal-content transform translate-y-full transition-transform md:relative md:top-auto md:inset-x-auto md:h-[85vh] md:rounded-[32px] md:mx-auto md:mt-[7vh] shadow-2xl overflow-hidden">

            <!-- Modal Header -->
            <div
                class="px-8 py-6 border-b border-slate-100 flex justify-between items-start sticky top-0 bg-white z-20">
                <div>
                    <div class="flex items-center gap-2">
                        <span
                            class="text-[10px] font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md border border-blue-100 uppercase tracking-tighter"
                            id="modalStep">STEP 01</span>
                    </div>
                    <h2 class="text-2xl font-black text-slate-800 mt-2 tracking-tight" id="modalTitle">단계 제목</h2>
                </div>
                <button onclick="closeModal()"
                    class="w-10 h-10 flex items-center justify-center bg-slate-100 rounded-full text-slate-500 hover:bg-slate-200 transition-colors"><i
                        class="fas fa-times"></i></button>
            </div>

            <!-- Modal Body (Two Column Desktop) -->
            <div class="flex-grow overflow-hidden flex flex-col md:flex-row relative">
                <!-- Left: List -->
                <div class="flex-grow overflow-y-auto bg-slate-50/50 p-6 md:w-1/2 border-r border-slate-100"
                    id="modalListContent"></div>

                <!-- Right: Content (Desktop) or Slide-over (Mobile) -->
                <div id="detailSlidePanel"
                    class="detail-panel md:relative md:translate-x-0 md:w-1/2 md:bg-white md:shadow-none">
                    <div
                        class="px-6 py-5 border-b border-slate-100 flex items-center gap-4 sticky top-0 bg-white z-20 md:bg-slate-50/30">
                        <button onclick="closeDetailPanel()"
                            class="w-8 h-8 flex items-center justify-center bg-slate-100 rounded-lg md:hidden"><i
                                class="fas fa-arrow-left text-sm"></i></button>
                        <h3 class="font-bold text-slate-800 text-lg truncate" id="detailPanelTitle">내용 상세 보기</h3>
                    </div>
                    <div class="flex-grow overflow-y-auto p-8 bg-white">
                        <div id="detailPanelBody" class="prose prose-blue prose-sm text-slate-700 w-full max-w-none">
                            <!-- Detail content injected here -->
                            <div class="flex flex-col items-center justify-center h-full text-slate-400 space-y-4">
                                <i class="fas fa-mouse-pointer text-4xl opacity-20"></i>
                                <p class="font-medium">좌측의 항목을 클릭하여 상세 정보를 확인하세요.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="border-t border-slate-100 p-5 bg-white flex justify-between items-center sticky bottom-0 z-20">
                <button onclick="prevTask()" id="btnPrev"
                    class="flex items-center gap-2 px-5 py-3 bg-slate-100 text-slate-600 rounded-2xl font-bold hover:bg-slate-200 transition-all"><i
                        class="fas fa-chevron-left"></i>이전 단계</button>
                <div class="hidden md:flex gap-1">
                    <div class="w-1.5 h-1.5 rounded-full bg-blue-600"></div>
                    <div class="w-1.5 h-1.5 rounded-full bg-slate-200"></div>
                    <div class="w-1.5 h-1.5 rounded-full bg-slate-200"></div>
                </div>
                <button onclick="nextTask()" id="btnNext"
                    class="flex items-center gap-2 px-6 py-3 bg-blue-600 text-white rounded-2xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 transition-all">다음
                    단계<i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </div>

    <!-- TOOLBOX MODAL -->
    <div id="toolboxModal" class="fixed inset-0 z-[60] hidden">
        <div class="modal-overlay absolute inset-0 bg-slate-900/70 backdrop-blur-md" onclick="closeToolbox()"></div>
        <div
            class="absolute inset-x-0 bottom-0 top-16 bg-white rounded-t-[40px] flex flex-col modal-content transform translate-y-full transition-transform md:relative md:top-auto md:h-[80vh] md:rounded-[32px] md:mt-[10vh] shadow-2xl overflow-hidden">
            <div class="px-8 py-8 border-b border-slate-100 flex justify-between items-start">
                <div>
                    <h2 class="text-2xl font-black text-slate-900">상황별 필승 멘트 공략집</h2>
                    <p class="text-sm text-slate-500 mt-2 font-medium">당신을 전문가로 만들어주는 7인의 이해관계자 대응법</p>
                </div>
                <button onclick="closeToolbox()"
                    class="w-10 h-10 flex items-center justify-center bg-slate-100 rounded-full text-slate-500"><i
                        class="fas fa-times"></i></button>
            </div>

            <!-- Toolbox Body (Two Column Desktop) -->
            <div class="flex-grow overflow-hidden flex flex-col md:flex-row relative">
                <!-- Left: List -->
                <div class="flex-grow overflow-y-auto bg-slate-50/50 p-6 md:w-1/2 border-r border-slate-100"
                    id="toolboxListContent"></div>

                <!-- Right: Toolbox Detail Panel -->
                <div id="toolboxDetailPanel"
                    class="detail-panel md:relative md:translate-x-0 md:w-1/2 md:bg-white md:shadow-none">
                    <div
                        class="px-6 py-5 border-b border-slate-100 flex items-center gap-4 sticky top-0 bg-white z-20 md:bg-slate-50/30">
                        <button onclick="closeToolboxDetail()"
                            class="w-8 h-8 flex items-center justify-center bg-slate-100 rounded-lg md:hidden"><i
                                class="fas fa-arrow-left text-sm"></i></button>
                        <h3 class="font-bold text-slate-800 text-lg truncate" id="toolboxDetailTitle">멘트 상세 가이드</h3>
                    </div>
                    <div class="flex-grow overflow-y-auto p-8 bg-white">
                        <div id="toolboxDetailBody" class="prose prose-blue prose-sm text-slate-700 w-full max-w-none">
                            <div class="flex flex-col items-center justify-center h-full text-slate-400 space-y-4">
                                <i class="fas fa-comment-dots text-4xl opacity-20"></i>
                                <p class="font-medium">좌측의 멘트 항목을 클릭하여 상세 내용을 확인하세요.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tasks = [
            {
                label: '1. 입지분석 & 매물임장', start: 0, end: 12, type: 'prep',
                checklists: [
                    { summary: '지역별 슈퍼호스트 80% 가동률 확인', detail: `<h5>수익성 검토의 기본</h5><p>내가 들어가려는 지역의 에어비앤비 리스팅을 열어보세요. 특히 **슈퍼호스트**들의 달력을 체크하여 향후 2달간의 예약률이 80% 이상인지 확인해야 합니다. 만약 60% 미만이라면 그 지역은 수요보다 공급이 많은 과열 지역일 가능성이 큽니다.</p>` },
                    { summary: '건축물대장 [위반건축물] 여부 확인', detail: `<h5>등록 불가 사유 1순위</h5><p>'정부24'에서 건축물대장을 발급받아 우측 상단에 노란색 **[위반건축물]** 표시가 있는지 반드시 확인하세요. 무단 증축, 베란다 확장 등 위반 사항이 있으면 구청 등록 자체가 불가능합니다.</p>` }
                ],
                tips: [
                    { summary: '역세권보다 중요한 "수요 포인트"', detail: `<h5>병세권, 학세권 공략</h5><p>단순히 역에서 가깝다고 잘되는 게 아닙니다. 대형 병원(보호자 수요), 대학(시험/면접 수요), 관광지(동대문/홍대) 등 명확한 목적이 있는 매물을 찾으세요. 병원 근처는 1주일 이상의 장기 숙박 수요가 매우 탄탄합니다.</p>` },
                    { summary: '반지하/옥탑의 반전 매력', detail: `<p>반지하라도 창문이 크고 채광이 어느 정도 확보된다면, 인테리어로 충분히 '감성 스테이' 연출이 가능합니다. 임대료가 저렴해 수익률은 오히려 옥탑이나 반지하가 훨씬 높은 경우가 많습니다.</p>` }
                ],
                warnings: [
                    { summary: '관리비 폭탄 주의', detail: `<div class="warn-box">오래된 빌라는 겨울철 공용 관리비나 난방비 누수 여부를 반드시 전 세입자에게 확인해야 합니다.</div>` }
                ]
            },
            {
                label: '2. 구청 담당자 유선 확인', start: 4, end: 12, type: 'prep',
                checklists: [
                    { summary: '주소지 등록 가능 여부 확인', detail: `<h5>담당자 확답 듣기</h5><p>구청 관광과(또는 문화관광과)에 전화하여 "외국인 관광 도시민박업 등록하려는데 이 주소지가 가능한 건축물인가요?"라고 물으세요. 건축물 용도가 '단독주택', '다가구', '아파트', '다세대'인 경우에만 가능합니다. 오피스텔은 법적으로 불가능합니다.</p>` },
                    { summary: '기존 민박업 폐업 여부', detail: `<p>해당 주소지에 이전 세입자가 민박업을 등록했다가 폐업하지 않고 나갔다면, 신규 등록이 지연될 수 있습니다. 중복 등록 여부를 체크하세요.</p>` }

                    { summary: '위홈(Wehome) 특례 신청', detail: `<h5>내국인 합법 예약의 치트키</h5><p>서울/부산 지역이라면 '위홈 공유숙박 특례'를 반드시 신청하세요. 에어비앤비에서 내국인을 받는 건 불법이지만, 위홈을 통하면 합법적으로 내국인 수요까지 흡수할 수 있습니다.</p>` }
                ],
                warnings: [
                    { summary: '소득세 신고 대비', detail: `<div class="warn-box">면세 사업자라도 1년에 한 번 사업장현황신고를 해야 합니다. 지출 증빙용 카드를 하나 정해두세요.</div>` }
                ]
            },
            {
                label: '14. 최종 런칭 및 운영 최적화', start: 44, end: 45, type: 'open',
                checklists: [
                    { summary: '첫 3개 리뷰 확보 전략', detail: `<h5>숙소의 운명을 결정하는 시기</h5><p>초기 3명에게는 손해 본다 생각하고 20~30% 할인 혜택을 제공하세요. 정성스러운 손편지와 웰컴 스낵은 5점 리뷰를 보장합니다.</p>` }
                ],
                tips: [
                    { summary: '자동 메시지 설정', detail: `<p>예약 완료, 체크인 전날, 체크인 당일, 체크아웃 전날 메시지를 미리 템플릿화해두세요. 운영 시간이 절반으로 줄어듭니다.</p>` },
                    { summary: '슈퍼호스트 목표 설정', detail: `<p>응답률 100%, 평점 4.8점 이상을 유지하세요. 슈퍼호스트 배지가 달리는 순간 검색 노출 빈도가 급상승합니다.</p>` }
                ],
                warnings: [
                    { summary: '플랫폼 밖 결제 유도 금지', detail: `<div class="warn-box">수수료 아끼려고 게스트에게 계좌이체를 요구하면 계정이 즉시 영구 정지됩니다. 절대 금물입니다.</div>` }
                ]
            }
        ];

        // --- STAKEHOLDER SCRIPTS DATA ---
        const toolboxData = [
            {
                target: '중개인 (Real Estate Agent)',
                icon: 'fa-building',
                items: [
                    { summary: '초보 티 안 내고 정보 캐내기', detail: `<div class="script-box"><blockquote>"사장님, 저 이미 다른 데서도 외도민 몇 개 운영 중인데, 이번에 OO구 쪽 확장하려고요. 위반 없는 빌라나 다가구 중에 전대차 협의 가능한 집 리스트 좀 뽑아주세요. 제가 결정은 제일 빠릅니다."</blockquote></div><p>중개사는 '결정이 빠른 고수'를 좋아합니다. 전문가인 척하면 중개사가 알아서 구청 확인까지 도와주는 경우도 많습니다.</p>` },
                    { summary: '복비(수수료) 협상 꿀팁', detail: `<p>단순히 깎아달라고 하지 말고, "사장님 이번에 계약하면 앞으로 인테리어 업자나 지인들도 이 지역 올 때 사장님만 소개할게요"라며 미래의 이익을 제시하세요.</p>` }
                ]
            },
            {
                target: '임대인 (Landlord)',
                icon: 'fa-user-tie',
                items: [
                    { summary: '숙박업 우려 불식시키기', detail: `<div class="script-box"><blockquote>"사장님, 제가 사업자 내고 합법적으로 할 거라 관리 하나는 끝내주게 할 겁니다. 제가 제 돈 들여서 조명 바꾸고 도배 새로 해서 집 가치 높여드릴 거예요. 나중에 사장님이 직접 쓰시거나 매매하실 때 훨씬 이득이실 겁니다."</blockquote></div><p>집주인은 '내 집이 험해지는 것'을 가장 두려워합니다. 매일 청소하고 관리하는 숙박업이 오히려 일반 세입자보다 깨끗하다는 점을 강조하세요.</p>` },
                    { summary: '렌트프리(공사 기간) 협상', detail: `<div class="script-box"><blockquote>"어차피 외국인 친구들 올 때까지 세팅 시간이 좀 걸려서요. 2주만 공사 기간으로 월세 빼주시면 바로 계약하겠습니다."</blockquote></div>` }
                ]
            },
            {
                target: '이웃 주민 (Neighbor)',
                icon: 'fa-users',
                items: [
                    { summary: '동의서 받을 때의 저자세 전략', detail: `<div class="script-box"><blockquote>"어르신, 제가 이번에 이 집으로 이사 와서 조용히 외국인 친구들 공부 가르치는 일을 좀 도와주려 합니다. 가끔 손님이 오실 건데 제가 같이 살면서 엄격하게 관리할 거예요. 혹시라도 조금만 시끄러우면 저한테 바로 전화주세요."</blockquote></div><p>숙박업이라는 단어보다 '지인 방문', '공부방', '작가 작업실' 같은 정적인 키워드를 섞어 신뢰감을 주어야 합니다.</p>` }
                ]
            },
            {
                target: '구청 주무관 (Official)',
                icon: 'fa-landmark',
                items: [
                    { summary: '실사 때 합격 유도하기', detail: `<div class="script-box"><blockquote>"주무관님 바쁘신데 시간 내주셔서 감사합니다. 제가 합법적으로 정말 제대로 해보고 싶어서 소방 시설도 기준보다 더 꼼꼼하게 설치해뒀습니다. 혹시 부족한 부분 있으면 말씀 주시는 대로 바로 보완하겠습니다."</blockquote></div><p>공무원에게는 '가르침을 받는 자세'가 중요합니다. 고집부리지 말고 수정 요청은 즉각 수용하는 척하세요.</p>` }
                ]
            },
            {
                target: '게스트 (Guest)',
                icon: 'fa-plane-arrival',
                items: [
                    { summary: '별점 5점 구걸(?) 멘트', detail: `<div class="script-box"><blockquote>"당신의 방문이 저에게는 큰 힘이 됩니다. 숙소가 만족스러우셨다면 별 5점 리뷰를 부탁드려도 될까요? 정성스러운 리뷰를 남겨주시면 다음 방문 때 특별 할인을 약속드립니다!"</blockquote></div>` },
                    { summary: '체크아웃 직전 리마인드', detail: `<div class="script-box"><blockquote>"벌써 떠나실 시간이라니 아쉽네요! 쓰레기는 현관 안쪽에 모아주시고, 에어컨만 꺼주시면 감사하겠습니다. 조심히 가세요!"</blockquote></div>` }
                ]
            }
        ];

        // --- CHART & MODAL LOGIC ---
        let currentTaskIndex = 0;
        const modal = document.getElementById('detailModal');
        const toolboxModal = document.getElementById('toolboxModal');
        const modalList = document.getElementById('modalListContent');
        const toolboxList = document.getElementById('toolboxListContent');
        const ctx = document.getElementById('mobileChart').getContext('2d');

        const getGradient = (ctx, type) => {
            const gradient = ctx.createLinearGradient(0, 0, 500, 0);
            if (type === 'prep') { gradient.addColorStop(0, '#94a3b8'); gradient.addColorStop(1, '#64748b'); }
            else if (type === 'milestone') { gradient.addColorStop(0, '#f87171'); gradient.addColorStop(1, '#ef4444'); }
            else if (type === 'critical') { gradient.addColorStop(0, '#fb923c'); gradient.addColorStop(1, '#f97316'); }
            else if (type === 'setup') { gradient.addColorStop(0, '#60a5fa'); gradient.addColorStop(1, '#3b82f6'); }
            else if (type === 'admin') { gradient.addColorStop(0, '#c084fc'); gradient.addColorStop(1, '#a855f7'); }
            else { gradient.addColorStop(0, '#34d399'); gradient.addColorStop(1, '#10b981'); }
            return gradient;
        };

        const mobileChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: tasks.map(t => t.label),
                datasets: [{
                    data: tasks.map(t => [t.start, t.end]),
                    backgroundColor: tasks.map(t => getGradient(ctx, t.type)),
                    borderRadius: 8,
                    borderSkipped: false,
                    barPercentage: 0.65,
                    categoryPercentage: 1.0,
                    hoverBorderColor: '#fff',
                    hoverBorderWidth: 2,
                    hoverBackgroundColor: tasks.map(t => getGradient(ctx, t.type)) // Maintain gradient but maybe could brighten?
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                onHover: (event, chartElement) => {
                    event.native.target.style.cursor = chartElement[0] ? 'pointer' : 'default';
                },
                onClick: (e) => {
                    const points = mobileChart.getElementsAtEventForMode(e, 'nearest', { intersect: true }, true);
                    if (points.length) openModal(points[0].index);
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        enabled: false,
                        external: function (context) {
                            const tooltip = context.tooltip;
                            const tooltipEl = document.getElementById('externalTooltip');
                            if (tooltip.opacity === 0) { tooltipEl.style.opacity = 0; return; }
                            const t = tasks[tooltip.dataPoints[0].dataIndex];
                            tooltipEl.innerHTML = `<div class="font-black text-sm mb-1">${t.label}</div><div class="text-blue-300 font-bold">진행 기간: Day ${t.start} ~ ${t.end}</div>`;
                            tooltipEl.style.opacity = 1;
                            tooltipEl.style.left = (tooltip.caretX + 170) + 'px';
                            tooltipEl.style.top = (tooltip.caretY + 20) + 'px';
                        }
                    }
                },
                scales: {
                    x: { min: 0, max: 48, display: false },
                    y: { display: false }
                }
            }
        });

        const labelContainer = document.getElementById('yAxisLabels');
        const bgContainer = document.getElementById('chartBackgroundRows');
        tasks.forEach((task, index) => {
            const el = document.createElement('div');
            el.className = "flex items-center pl-4 pr-3 cursor-pointer border-b border-slate-50 hover:bg-blue-50 transition-colors h-[50px] group";
            el.innerHTML = `<span class="text-[12px] font-bold text-slate-500 group-hover:text-blue-700 truncate transition-colors">${task.label}</span>`;

            // Custom Tooltip Logic (Restored)
            el.addEventListener('mouseenter', () => {
                const tooltipEl = document.getElementById('externalTooltip');
                tooltipEl.innerHTML = `<div class="font-black text-sm text-slate-100">${task.label}</div>`;
                tooltipEl.style.opacity = 1;
            });
            el.addEventListener('mousemove', (e) => {
                const tooltipEl = document.getElementById('externalTooltip');
                // Calculate position relative to container
                const relParent = tooltipEl.offsetParent;
                const rect = relParent.getBoundingClientRect();
                const x = e.clientX - rect.left + 20;
                const y = e.clientY - rect.top;
                tooltipEl.style.left = x + 'px';
                tooltipEl.style.top = y + 'px';
            });
            el.addEventListener('mouseleave', () => {
                document.getElementById('externalTooltip').style.opacity = 0;
            });

            el.onclick = () => openModal(index);
            labelContainer.appendChild(el);
            const row = document.createElement('div');
            row.className = "w-full border-b border-slate-50 h-[50px]";
            bgContainer.appendChild(row);
        });

        function openModal(index) {
            document.body.style.overflow = 'hidden'; // Lock Body Scroll
            currentTaskIndex = index;
            const task = tasks[index];
            document.getElementById('modalStep').innerText = `STEP ${String(index + 1).padStart(2, '0')}`;
            document.getElementById('modalTitle').innerText = task.label;

            let html = '';
            const renderItems = (items, type, icon, colorClass) => {
                if (!items || !items.length) return;
                html += `<h5 class="text-[11px] font-black text-slate-400 mt-8 mb-3 tracking-widest uppercase flex items-center gap-2"><i class="${icon}"></i> ${type}</h5>`;
                items.forEach((item) => {
                    const safeSummary = encodeURIComponent(item.summary).replace(/'/g, "%27");
                    const safeDetail = encodeURIComponent(item.detail).replace(/'/g, "%27");
                    html += `
                    <div class="guide-card" onclick="openDetailPanel('${safeSummary}', '${safeDetail}')">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-slate-700 text-[14px] ${colorClass}">${item.summary}</span>
                            <i class="fas fa-chevron-right text-slate-300 text-[10px]"></i>
                        </div>
                    </div>`;
                });
            };

            renderItems(task.checklists, '필수 체크리스트', 'fas fa-check-circle', 'text-slate-800');
            renderItems(task.tips, '고수들의 필살기', 'fas fa-magic', 'text-blue-600');
            renderItems(task.warnings, '실패 방지 주의사항', 'fas fa-exclamation-triangle', 'text-red-500');

            modalList.innerHTML = html;
            modal.classList.remove('hidden');
            setTimeout(() => modal.querySelector('.modal-content').classList.remove('translate-y-full'), 10);

            // On desktop, auto-open first item
            if (window.innerWidth > 768 && task.checklists.length > 0) {
                openDetailPanel(encodeURIComponent(task.checklists[0].summary), encodeURIComponent(task.checklists[0].detail));
            } else {
                closeDetailPanel();
            }

            // Button Visibility Logic
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');

            if (index === 0) {
                btnPrev.style.visibility = 'hidden';
            } else {
                btnPrev.style.visibility = 'visible';
            }

            if (index === tasks.length - 1) {
                btnNext.style.visibility = 'hidden';
            } else {
                btnNext.style.visibility = 'visible';
            }
        }

        function closeModal() {
            document.body.style.overflow = ''; // Unlock Body Scroll
            modal.querySelector('.modal-content').classList.add('translate-y-full');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function openDetailPanel(title, detail) {
            document.getElementById('detailPanelTitle').innerText = decodeURIComponent(title);
            document.getElementById('detailPanelBody').innerHTML = decodeURIComponent(detail);
            document.getElementById('detailSlidePanel').classList.add('active');
        }

        function closeDetailPanel() { document.getElementById('detailSlidePanel').classList.remove('active'); }

        // --- TOOLBOX FUNCTIONS ---
        function openToolbox() {
            document.body.style.overflow = 'hidden'; // Lock Body Scroll
            let html = '';
            toolboxData.forEach(section => {
                html += `<div class="mb-8"><h3 class="text-lg font-black text-blue-800 mb-4 flex items-center gap-3"><i class="fas ${section.icon} bg-blue-100 p-2 rounded-xl text-blue-600"></i> ${section.target}</h3>`;
                section.items.forEach(item => {
                    const safeSummary = encodeURIComponent(item.summary).replace(/'/g, "%27");
                    const safeDetail = encodeURIComponent(item.detail).replace(/'/g, "%27");
                    html += `
                    <div class="guide-card" onclick="openToolboxDetail('${safeSummary}', '${safeDetail}')">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-slate-700 text-sm">${item.summary}</span>
                            <i class="fas fa-comment-dots text-blue-400 text-sm"></i>
                        </div>
                    </div>`;
                });
                html += `</div>`;
            });
            toolboxList.innerHTML = html;
            toolboxModal.classList.remove('hidden');
            setTimeout(() => toolboxModal.querySelector('.modal-content').classList.remove('translate-y-full'), 10);

            // On desktop, auto-open first item in toolbox
            if (window.innerWidth > 768 && toolboxData.length > 0 && toolboxData[0].items.length > 0) {
                const first = toolboxData[0].items[0];
                openToolboxDetail(encodeURIComponent(first.summary), encodeURIComponent(first.detail));
            } else {
                closeToolboxDetail();
            }
        }

        function closeToolbox() {
            document.body.style.overflow = ''; // Unlock Body Scroll
            toolboxModal.querySelector('.modal-content').classList.add('translate-y-full');
            setTimeout(() => toolboxModal.classList.add('hidden'), 400);
        }

        function openToolboxDetail(title, detail) {
            document.getElementById('toolboxDetailTitle').innerText = decodeURIComponent(title);
            document.getElementById('toolboxDetailBody').innerHTML = decodeURIComponent(detail);
            document.getElementById('toolboxDetailPanel').classList.add('active');
        }

        function closeToolboxDetail() {
            document.getElementById('toolboxDetailPanel').classList.remove('active');
        }

        function prevTask() { if (currentTaskIndex > 0) openModal(currentTaskIndex - 1); }
        function nextTask() { if (currentTaskIndex < tasks.length - 1) openModal(currentTaskIndex + 1); }

        // Search logic
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const results = document.getElementById('searchResults');
            results.innerHTML = '';
            if (val.length < 2) { results.classList.add('hidden'); return; }
            const matches = [];
            tasks.forEach((t, ti) => {
                [...t.checklists, ...t.tips, ...t.warnings].forEach(i => {
                    if (i.summary.toLowerCase().includes(val) || i.detail.toLowerCase().includes(val)) matches.push({ taskIdx: ti, item: i });
                });
            });
            if (matches.length) {
                results.classList.remove('hidden');
                matches.slice(0, 8).forEach(m => {
                    const d = document.createElement('div');
                    d.className = "p-4 border-b border-slate-50 active:bg-blue-50 cursor-pointer hover:bg-slate-50 transition-colors";
                    d.innerHTML = `<div class="text-[10px] text-blue-500 font-black mb-1">${tasks[m.taskIdx].label}</div><div class="text-[13px] font-bold text-slate-800">${m.item.summary}</div>`;
                    d.onclick = () => { openModal(m.taskIdx); results.classList.add('hidden'); };
                    results.appendChild(d);
                });
            } else {
                results.classList.remove('hidden');
                results.innerHTML = '<div class="p-4 text-center text-slate-400 text-sm">검색 결과가 없습니다.</div>';
            }
        });
    </script>
</body>

</html>
